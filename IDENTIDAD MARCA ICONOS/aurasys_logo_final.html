<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurasys - Logo Final (Deep Tech)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .bar { transform-origin: bottom; transform: scaleY(0.1); }
        .bar:nth-child(1) { animation: wave 1s ease-in-out infinite alternate 0.0s; fill: #2563eb; }
        .bar:nth-child(2) { animation: wave 1s ease-in-out infinite alternate 0.2s; fill: #60a5fa; }
        .bar:nth-child(3) { animation: wave 1s ease-in-out infinite alternate 0.4s; fill: #38bdf8; }
        .bar:nth-child(4) { animation: wave 1s ease-in-out infinite alternate 0.2s; fill: #60a5fa; }
        .bar:nth-child(5) { animation: wave 1s ease-in-out infinite alternate 0.0s; fill: #2563eb; }
        
        .text-group { transform: translateX(20px); opacity: 0; animation: slideIn 0.8s ease 0.5s forwards; }
        .text-aura { font-weight: 800; font-size: 42px; fill: #ffffff; }
        .text-sys { font-weight: 300; font-size: 42px; fill: #38bdf8; }
        .tagline { font-weight: 400; font-size: 13px; letter-spacing: 1px; fill: #94a3b8; }

        @keyframes wave { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
        @keyframes slideIn { 100% { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <svg width="350" height="120" viewBox="0 0 350 120">
        <g transform="translate(20, 20)">
            <!-- Isotipo: Onda Cinética -->
            <g transform="translate(0, 70)">
                <rect class="bar" x="0" y="-20" width="8" height="20" rx="4"/>
                <rect class="bar" x="12" y="-40" width="8" height="40" rx="4"/>
                <rect class="bar" x="24" y="-60" width="8" height="60" rx="4"/>
                <rect class="bar" x="36" y="-40" width="8" height="40" rx="4"/>
                <rect class="bar" x="48" y="-20" width="8" height="20" rx="4"/>
            </g>
            <!-- Logotipo y Eslogan -->
            <g class="text-group" transform="translate(75, 0)">
                <text x="0" y="52" class="text-aura">Aura</text>
                <text x="105" y="52" class="text-sys">sys</text>
                <text x="2" y="75" class="tagline">Dale estructura a tus ideas</text>
            </g>
        </g>
    </svg>
</body>
</html>
